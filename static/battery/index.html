<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Battery status monitor for amateur radio batteries over BLE." />
  <meta name="theme-color" content="#f3efe2" />
  <title>Battery Status</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/battery-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top aux-ui aux-ui-collapse">
      <div class="title-wrap">
        <h1 class="title">Battery Status</h1>
        <a class="byline-link" href="https://lb2kk.no/">By lb2kk.no</a>
      </div>
      <div class="controls">
        <button id="installBtn" class="install-btn icon-btn top-icon-btn" type="button" hidden aria-label="Install app" title="Install app"><span class="material-icons" aria-hidden="true">download</span></button>
        <button id="themeBtn" class="theme-btn icon-btn top-icon-btn" type="button" aria-label="Toggle dark and light theme" title="Toggle theme"><span class="material-icons" aria-hidden="true">contrast</span></button>
      </div>
    </header>
    <section id="unsupportedBanner" class="banner banner-error" hidden></section>

    <section class="summary-card" aria-live="polite">
      <canvas id="socSparkline" class="summary-sparkline" aria-hidden="true"></canvas>
      <p class="summary-device-row">
        <strong id="displayDeviceName" class="device-name-value">-</strong>
        <button id="editDeviceNameBtn" class="edit-name-btn small aux-ui" type="button" aria-label="Edit local battery name" title="Edit local battery name" disabled><span class="material-symbols-outlined" aria-hidden="true">edit</span></button>
      </p>
      <p class="summary-line-primary">
        <span id="packVoltage" class="summary-voltage">--.-- V</span>
        <span id="socPercent" class="summary-soc">-- %</span>
      </p>
      <p class="summary-line-status">
        <span id="statusText">Standby</span>
        <span id="estTimeLeft" class="summary-est-time">-</span>
      </p>
      <p class="summary-line-secondary">
        <span id="currentWithPeak" title="Current and Max Current">--.-- A (max: --.-- A)</span>
        <span id="capacityRemaining" title="Capacity">--.- Ah</span>
      </p>
    </section>

    <details class="details aux-ui aux-ui-collapse">
      <summary>Details</summary>
      <div class="details-grid">
        <p><strong>Protocol:</strong> <span id="activeProtocol">-</span></p>
        <p><strong>Device:</strong> <span id="deviceName">-</span></p>
        <p><strong>Nominal Capacity:</strong> <input id="nominalCapacityAhInput" class="details-capacity-input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Ah" disabled /></p>
        <p><strong>Cycle Count:</strong> <span id="cycleCount">-</span></p>
        <p><strong>Temperature:</strong> <span id="temperature">-</span></p>
        <p><strong>Signal:</strong> <span id="signalRssi">-</span></p>
        <p><strong>Last Update:</strong> <span id="lastUpdate">-</span></p>
        <p><strong>Cells:</strong> <span id="cells">-</span></p>
        <p><strong>Status Flags:</strong> <span id="statusFlags">-</span></p>
      </div>
      <p class="details-actions">
        <button id="resetStatsBtn" class="text-link-btn" type="button">Reset stats</button>
      </p>
      <p id="statusLine" class="status">Ready.</p>
      <label class="label" for="rawFrame">Raw frame (latest)</label>
      <textarea id="rawFrame" rows="4" readonly></textarea>
    </details>
    <section id="actions" class="actions aux-ui-collapse">
      <button id="connectBtn" class="primary" type="button">Connect</button>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
